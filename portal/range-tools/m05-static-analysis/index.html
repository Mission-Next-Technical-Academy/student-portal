<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Static File Analysis — Module 5</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0b1220; }
    #m05-boot-status { font: 13px/1.5 system-ui, sans-serif; padding: 24px; color: #9ab0d1; }
  </style>
</head>
<body>
  <div id="m05-boot-status">Loading Static File Analysis…</div>
  <div id="m05-root"></div>

  <!-- Same runtime approach as the Mission Next source this tool was ported
       from: no build step, React/Babel loaded from CDN, JSX transpiled in
       the browser. Scoped to this standalone tool page only — the rest of
       the portal has no React dependency and this page does not add one. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script src="static-analysis-data.js"></script>
  <script type="text/babel" src="static-analysis.jsx"></script>

  <script type="text/babel">
    const statusEl = document.getElementById('m05-boot-status');
    if (!window.React || !window.ReactDOM || !window.StaticAnalysisConsole) {
      statusEl.textContent = 'Static File Analysis failed to load (a script from unpkg.com may be blocked). Reload, or check your connection.';
    } else {
      const mode = new URLSearchParams(location.search).get('mode') === 'prove' ? 'prove' : 'practice';
      statusEl.remove();
      const root = ReactDOM.createRoot(document.getElementById('m05-root'));
      root.render(<window.StaticAnalysisConsole mode={mode} />);
    }
  </script>
</body>
</html>
