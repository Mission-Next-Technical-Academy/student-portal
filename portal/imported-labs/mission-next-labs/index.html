  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],

  <script>
    (function () {
      const criticalDependencies = new Set(['React', 'ReactDOM', 'Babel']);
      const state = {
        failed: false,
        rendered: false,
        failures: [],
        loaded: new Set(),
        pendingError: null,
      };

      function rootNode() {
        let root = document.getElementById('root');
        if (!root && document.body) {
          root = document.createElement('div');
          root.id = 'root';
          document.body.prepend(root);
        }
        return root;
      }

      function describeSource(source) {
        if (!source) return 'unknown source';
        try {
          return new URL(source, window.location.href).href;
        } catch (error) {
          return source;
        }
      }

      function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, function (char) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
          }[char];
        });
      }

      function renderBootError(title, detail) {
        if (state.failed) return;
        state.failed = true;
        const root = rootNode();
        if (!root) {
          state.failed = false;
          state.pendingError = { title, detail };
          return;
        }
        state.pendingError = null;
        root.innerHTML = `
          <main class="boot-failure" role="alert" aria-live="assertive">
            <section class="boot-failure__panel">
              <p class="boot-failure__eyebrow">Boot failure</p>
              <h1>${escapeHtml(title || 'Failed to load app dependencies')}</h1>
              <p>${escapeHtml(detail || 'One or more required scripts did not load, so the app could not start.')}</p>
              <div class="boot-failure__details">
                <strong>Next step:</strong> refresh the page or check the network/CDN response in DevTools.
              </div>
              <div class="boot-failure__details">
                <strong>Resilience option:</strong> bundle React, ReactDOM, Babel replacement, and Motion locally with Vite or Webpack instead of loading runtime CDNs.
              </div>
            </section>
          </main>
        `;
      }

      function failDependency(name, source) {
        const detail = `${name || 'A required script'} failed to load from ${describeSource(source)}.`;
        state.failures.push({ name, source });
        if (criticalDependencies.has(name)) {
          renderBootError('Failed to load app dependencies', detail);
        } else {
          console.warn('[boot] Optional dependency failed:', detail);
        }
      }

      function failApp(detail) {
        renderBootError('Failed to start app', detail || 'The app scripts loaded, but the app did not render.');
      }

      window.__bootScriptLoaded = function (name) {
        state.loaded.add(name);
      };

      window.__bootScriptFailed = failDependency;

      window.__bootAppRendered = function () {
        state.rendered = true;
      };

      window.__showBootError = renderBootError;

      window.addEventListener('error', function (event) {
        const target = event.target;
        if (target && target.tagName === 'SCRIPT') {
          failDependency(target.dataset.bootName || 'Script', target.src);
          return;
        }
        if (!state.rendered) {
          failApp(event.message || 'A JavaScript error occurred before the app rendered.');
        }
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        if (!state.rendered) {
          const reason = event.reason && (event.reason.message || String(event.reason));
          failApp(reason || 'A promise rejection occurred before the app rendered.');
        }
      });

      window.addEventListener('DOMContentLoaded', function () {
        if (state.pendingError) {
          renderBootError(state.pendingError.title, state.pendingError.detail);
        }

        const root = rootNode();
        if (root) {
          const markRendered = function () {
            if (root.children.length > 0 && !root.querySelector('.boot-failure')) {
              state.rendered = true;
            }
          };
          markRendered();
          new MutationObserver(markRendered).observe(root, { childList: true });
        }

        window.setTimeout(function () {
          if (!window.React) failDependency('React', 'https://unpkg.com/react@18.3.1/umd/react.development.js');
          if (!window.ReactDOM) failDependency('ReactDOM', 'https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js');
          if (!window.Babel) failDependency('Babel', 'https://unpkg.com/@babel/standalone@7.29.0/babel.min.js');
        }, 1200);

        window.setTimeout(function () {
          if (!state.rendered && !state.failed) {
            failApp('The root element is still empty after the boot timeout. A local app script or JSX transform may have failed.');
          }
        }, 8000);
      });
    })();
  </script>
  <script data-boot-name="React" src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous" onload="window.__bootScriptLoaded('React')" onerror="window.__bootScriptFailed('React', this.src)"></script>
  <script data-boot-name="ReactDOM" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous" onload="window.__bootScriptLoaded('ReactDOM')" onerror="window.__bootScriptFailed('ReactDOM', this.src)"></script>
  <script data-boot-name="Babel" src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous" onload="window.__bootScriptLoaded('Babel')" onerror="window.__bootScriptFailed('Babel', this.src)"></script>
  <script type="module">
    import('https://cdn.jsdelivr.net/npm/motion@12.23.24/+esm')

        window.MotionOne = { animate };
        window.__bootScriptLoaded('Motion');
        window.dispatchEvent(new CustomEvent('motion-one-ready'));
      })
      .catch((error) => {
        window.__bootScriptFailed('Motion', 'https://cdn.jsdelivr.net/npm/motion@12.23.24/+esm');
        console.warn('[boot] Motion failed; using WAAPI animation fallback.', error);
      });
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { min-height: 100%; }
    html { background: #0b0f14; }
    body {
      background:
        radial-gradient(circle at 18% 12%, rgba(34,197,94,0.09), transparent 28rem),
        radial-gradient(circle at 82% 0%, rgba(56,189,248,0.08), transparent 24rem),
        linear-gradient(135deg, #070b10 0%, #0b0f14 52%, #081018 100%);
      overflow-x: hidden;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* --- Selection --- */
    ::selection { background: rgba(34,197,94,0.28); color: #f0fdf4; }
    ::-moz-selection { background: rgba(34,197,94,0.28); color: #f0fdf4; }

    /* --- Scrollbar --- */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(8,13,20,0.6); }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #1e3a2e 0%, #0f2018 100%);
      border-radius: 4px;
      transition: background 0.2s ease;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
      box-shadow: 0 0 8px rgba(34,197,94,0.4);
    }
    ::-webkit-scrollbar-corner { background: transparent; }

    /* --- Keyframes --- */
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 6px #22c55e, 0 0 12px rgba(34,197,94,0.35); }
      50% { box-shadow: 0 0 10px #22c55e, 0 0 20px rgba(34,197,94,0.55); }
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes cyberDrift {
      0%, 100% { transform: translate3d(0,0,0) scale(1); opacity: 0.68; }
      50% { transform: translate3d(1.4rem,-1rem,0) scale(1.03); opacity: 0.92; }
    }
    @keyframes skeletonSweep {
      0% { background-position: 220% 0; }
      100% { background-position: -220% 0; }
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 25%, rgba(34,197,94,0.12), transparent 22rem),
        radial-gradient(circle at 75% 18%, rgba(56,189,248,0.10), transparent 18rem),
        radial-gradient(circle at 55% 82%, rgba(167,139,250,0.07), transparent 20rem);
      filter: blur(18px);
      animation: cyberDrift 11s ease-in-out infinite;
      will-change: transform, opacity;
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(34,197,94,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,189,248,0.028) 1px, transparent 1px);
      background-size: clamp(28px, 4vw, 48px) clamp(28px, 4vw, 48px);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.75), rgba(0,0,0,0.08));
      z-index: -1;
    }

    /* --- Page entrance --- */
    #root { animation: fadeIn 0.35s ease-out; }
    #root > div { animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1); }

    /* --- Buttons (global smoothing + press feedback) --- */
    button {
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
      will-change: transform, filter, box-shadow;
      border-radius: 6px;
    }
    button:hover:not(:disabled) { filter: brightness(1.18); }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { cursor: not-allowed; filter: saturate(0.6); }

    /* Green-outline buttons (detected by inline border color) */
    button[style*="#22c55e"]:hover:not(:disabled) {
      box-shadow: 0 0 16px rgba(34,197,94,0.25), inset 0 0 12px rgba(34,197,94,0.06);
      text-shadow: 0 0 8px rgba(34,197,94,0.45);
    }
    /* Solid green filled buttons (Run, Next, etc.) */
    button[style*="background:#22c55e"]:hover:not(:disabled),
    button[style*="background: #22c55e"]:hover:not(:disabled) {
      box-shadow: 0 0 22px rgba(34,197,94,0.45), 0 2px 10px rgba(0,0,0,0.4);
      text-shadow: none;
    }

    /* Red / error */
    button[style*="#f87171"]:hover:not(:disabled) {
      box-shadow: 0 0 14px rgba(248,113,113,0.22);
    }

    /* --- Focus outlines (keyboard) --- */
    button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible {
      outline: 1px dashed rgba(34,197,94,0.55);
      outline-offset: 2px;
    }

    /* --- Inputs --- */
    input { transition: box-shadow 0.18s ease, border-color 0.18s ease; }
    input:focus {
      box-shadow: 0 0 0 1px rgba(34,197,94,0.45), 0 0 16px rgba(34,197,94,0.15);
    }
    input::placeholder { color: #334155; transition: color 0.2s; }
    input:focus::placeholder { color: #1e3a2e; }

    select option { background: #0f1520; }

    /* --- Table rows --- */
    tbody tr { transition: background 0.15s ease; }
    tbody tr:hover { background: rgba(34,197,94,0.05) !important; }

    /* --- Cards (opt-in via data-card) --- */
    [data-card] {
      border-radius: 8px;
      backdrop-filter: blur(16px);
      transform: translate3d(0,0,0);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.25s ease,
                  box-shadow 0.25s ease,
                  background 0.25s ease;
    }
    [data-card]:hover {
      border-color: rgba(34,197,94,0.52) !important;
      transform: translateY(-3px);
      box-shadow: 0 10px 32px rgba(0,0,0,0.45), 0 0 22px rgba(34,197,94,0.12);
      background: rgba(17,24,37,0.92) !important;
    }
    [data-card]:active { transform: translateY(-1px); }

    /* --- Status dot pulse (opt-in) --- */
    [data-status="online"] { animation: dotPulse 2.2s ease-in-out infinite; }

    /* --- Progress bar shimmer (opt-in) --- */
    [data-shimmer] {
      background-size: 200% 100% !important;
      animation: gradientShift 4s ease infinite;
    }

    /* --- Details/summary polish --- */
    summary { transition: color 0.2s; }
    summary:hover { color: #22c55e !important; }

    /* --- Links (fallback, safe) --- */
    a { color: #22c55e; text-decoration: none; transition: filter 0.15s; }
    a:hover { filter: brightness(1.2); text-decoration: underline; }

    [data-reveal] {
      transform: translate3d(0, 0, 0);
      will-change: transform, opacity, filter;
    }

    .boot-failure {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }

    .boot-failure__panel {
      width: min(100%, 560px);
      padding: 24px;
      border: 1px solid rgba(248,113,113,0.35);
      border-radius: 8px;
      background: rgba(15,23,42,0.92);
      box-shadow: 0 24px 80px rgba(0,0,0,0.42);
    }

    .boot-failure__eyebrow {
      margin-bottom: 10px;
      color: #f87171;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .boot-failure h1 {
      margin-bottom: 12px;
      color: #f8fafc;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .boot-failure p {
      margin-bottom: 16px;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .boot-failure__details {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 6px;
      background: rgba(2,6,23,0.45);
      color: #cbd5e1;
      line-height: 1.5;
    }

    @media (max-width: 780px) {
      nav {
        min-height: 52px;
        height: auto !important;
        flex-wrap: wrap;
        gap: 0.75rem;
        padding-block: 0.75rem !important;
      }

      [data-side-rail] {
        display: none !important;
      }
    }

    @media (max-width: 980px) {
      [data-module-layout] {
        grid-template-columns: 1fr !important;
      }

      [data-module-layout] > * {
        border-right: none !important;
      }
    }

    @media (max-width: 860px) {
      [data-wf-workspace] {
        grid-template-columns: 1fr !important;
      }
    }

    /* --- Respect reduced motion --- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
