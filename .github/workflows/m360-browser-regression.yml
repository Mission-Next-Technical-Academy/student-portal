name: M360 browser regression

on:
  pull_request:
    paths:
      - 'portal/m360/**'
      - 'portal/m360-preview.*'
      - 'tests/m360-runtime.spec.js'
      - '.github/workflows/m360-browser-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    name: M360 Browser Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local portal
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/m360-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/portal/m360/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/m360-http.log
          exit 1
      - name: Run six-week M360 browser regression
        env:
          M360_TEST_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/m360-runtime.spec.js --reporter=line
