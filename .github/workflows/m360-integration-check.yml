name: M360 integration checks

on:
  pull_request:
    paths:
      - 'portal/m360/**'
      - 'portal/m360-entry.js'
      - 'supabase/migrations/*m360*'
      - '.github/workflows/pages.yml'
      - '.github/workflows/m360-integration-check.yml'
  push:
    branches: [master]
    paths:
      - 'portal/m360/**'
      - 'portal/m360-entry.js'
      - 'supabase/migrations/*m360*'
      - '.github/workflows/pages.yml'
      - '.github/workflows/m360-integration-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check portal/m360-entry.js
          node --check portal/m360/home.js
          node --check portal/m360/m360-data.js
          node --check portal/m360/m360-production-bridge.js
          node --check portal/m360/m360-production-nav.js
          node --check portal/m360/review.js
          node --check portal/m360/week3.js
          node --check portal/m360/week4.js
          node --check portal/m360/week5.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('portal/m360/week.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S | re.I)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline loader script in week.html; found {len(scripts)}')
          Path('/tmp/m360-week-loader.js').write_text(scripts[0])
          PY
          node --check /tmp/m360-week-loader.js

      - name: Protect technical LMS boundary
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          forbidden='^(portal/app\.js|portal/data\.js|portal/module-labs\.js|portal/soc-analyst-module-|portal/it-support-module-|portal/ai-ml-module-|portal/electrical-module-)'
          if printf '%s\n' "$changed" | grep -Eq "$forbidden"; then
            echo '::error::M360 work must not modify technical LMS runtime files.'
            exit 1
          fi

      - name: Protect technical database boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          sql = Path('supabase/migrations/20260904012000_m360_core.sql').read_text()
          sql_without_comments = re.sub(r'--.*$', '', sql, flags=re.M).lower()
          protected = [
              'module_progress', 'lab_attempts', 'capstone_submissions',
              'portfolio_artifacts', 'course_progress', 'sim_state'
          ]
          for table in protected:
              pattern = rf'\b(alter\s+table|drop\s+table|insert\s+into|update|delete\s+from)\s+(public\.)?{re.escape(table)}\b'
              if re.search(pattern, sql_without_comments):
                  raise SystemExit(f'M360 migration attempts to write or alter protected technical table: {table}')
          print('M360 migration is additive relative to protected technical tables')
          PY

      - name: Protect Week 3 showcase privacy boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          js = Path('portal/m360/week3.js').read_text()
          match = re.search(r'function renderProof\(\)\s*\{(.*?)\n  \}\n\n  function renderReviewStatus', js, flags=re.S)
          if not match:
              raise SystemExit('Could not locate Week 3 showcase renderProof function')
          proof = match.group(1)
          private_fields = [
              'networkTargets', 'trackerNote', 'actionEvidence', 'actionCompleted',
              'connectionRequest', 'adviceRequest', 'informationalRequest'
          ]
          leaked = [field for field in private_fields if field in proof]
          if leaked:
              raise SystemExit('Week 3 showcase renderer references private fields: ' + ', '.join(leaked))
          required_copy = [
              'Private networking details',
              'never auto-exported into the showcase portfolio',
              'showcase portfolio remains sanitized'
          ]
          html = Path('portal/m360/week3.html').read_text()
          for phrase in required_copy:
              if phrase not in html:
                  raise SystemExit(f'Missing Week 3 privacy boundary copy: {phrase}')
          print('Week 3 showcase renderer is isolated from raw networking/private evidence fields')
          PY

      - name: Protect Week 4 evidence and Week 3 carry-forward boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          js = Path('portal/m360/week4.js').read_text()
          html = Path('portal/m360/week4.html').read_text()

          if 'const MIN_BULLETS = 3;' not in js:
              raise SystemExit('Week 4 must require at least three evidence bullets')
          if 'for (let i = 1; i <= 5; i += 1)' not in js:
              raise SystemExit('Week 4 must require at least five target signals')
          if 'Evidence integrity confirmation' not in js or 'supportable claims' not in html:
              raise SystemExit('Week 4 evidence-integrity requirement is missing')

          match = re.search(r'function renderCarryForward\(\)\s*\{(.*?)\n  \}\n\n  function artifactSource', js, flags=re.S)
          if not match:
              raise SystemExit('Could not locate Week 4 renderCarryForward function')
          carry = match.group(1)
          raw_week3_fields = [
              'networkTargets', 'trackerNote', 'actionEvidence', 'actionCompleted',
              'connectionRequest', 'adviceRequest', 'informationalRequest'
          ]
          leaked = [field for field in raw_week3_fields if field in carry]
          if leaked:
              raise SystemExit('Week 4 carry-forward references raw Week 3 private fields: ' + ', '.join(leaked))
          if 'safeWeek3Insight' not in carry:
              raise SystemExit('Week 4 must use the sanitized Week 3 insight boundary')

          print('Week 4 targeting/evidence requirements and Week 3 privacy carry-forward boundary are enforced')
          PY

      - name: Protect Week 5 required and optional boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          js = Path('portal/m360/week5.js').read_text()
          html = Path('portal/m360/week5.html').read_text()

          if 'const MIN_STORIES=4;' not in js:
              raise SystemExit('Week 5 must require exactly four minimum STAR stories')
          if "['Interviewer question 1',d.interviewerQuestion1]" not in js or "['Interviewer question 2',d.interviewerQuestion2]" not in js:
              raise SystemExit('Week 5 must require at least two interviewer questions')
          if 'Four complete stories are required' not in html:
              raise SystemExit('Week 5 learner-facing minimum-four story language is missing')
          if 'Optional — not graded' not in html or 'Optional private working material' not in html:
              raise SystemExit('Week 5 optional Practice It boundaries are not explicit')

          missing_start = js.find('function missing(){')
          missing_end = js.find('function readyCount()', missing_start)
          if missing_start < 0 or missing_end < 0:
              raise SystemExit('Could not locate Week 5 required-field validator')
          required_validator = js[missing_start:missing_end]
          forbidden_gates = ['professionalIntroduction', 'technicalScenario', 'technicalReasoning', 'interviewerQuestion3']
          gated = [field for field in forbidden_gates if field in required_validator]
          if gated:
              raise SystemExit('Optional Week 5 fields are incorrectly completion-gating: ' + ', '.join(gated))

          proof_start = js.find('function renderProof(){')
          proof_end = js.find('function renderReview()', proof_start)
          if proof_start < 0 or proof_end < 0:
              raise SystemExit('Could not locate Week 5 showcase renderProof function')
          proof = js[proof_start:proof_end]
          private_fields = ['technicalScenario', 'technicalReasoning']
          leaked = [field for field in private_fields if field in proof]
          if leaked:
              raise SystemExit('Week 5 showcase renderer references private technical scenario fields: ' + ', '.join(leaked))
          if 'professionalIntroduction' not in proof:
              raise SystemExit('Week 5 optional professional introduction must be permitted as reusable portfolio material')

          print('Week 5 four-story minimum, optional practice, and private scenario boundaries are enforced')
          PY

      - name: Verify production shell files
        run: |
          set -euo pipefail
          test -f portal/m360/index.html
          test -f portal/m360/week.html
          test -f portal/m360/week3.html
          test -f portal/m360/week3.js
          test -f portal/m360/week3.css
          test -f portal/m360/week4.html
          test -f portal/m360/week4.js
          test -f portal/m360/week4.css
          test -f portal/m360/week5.html
          test -f portal/m360/week5.js
          test -f portal/m360/week5.css
          test -f portal/m360/review.html
          test -f portal/m360/m360-data.js
          test -f portal/m360/m360-production-bridge.js
          test -f portal/m360/m360-production-nav.js
          test -f portal/m360-entry.js
          grep -q "3: {" portal/m360/week.html
          grep -q "4: {" portal/m360/week.html
          grep -q "5: {" portal/m360/week.html
          grep -q 'RELEASED_WEEKS = \[1, 2, 3, 4, 5\]' portal/m360/m360-production-bridge.js
          grep -q 'm360-entry.js?v=20260904' .github/workflows/pages.yml
