name: M360 Wave 2 Start Here usability guard

on:
  pull_request:
    paths:
      - 'portal/m360/start-here.html'
      - 'portal/m360/start-here.js'
      - 'portal/m360/start-here.css'
      - '.github/workflows/m360-wave2-start-here-usability-check.yml'

permissions:
  contents: read

jobs:
  wave2-start-here:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Wave 2 scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(.github/workflows/m360-wave2-start-here-usability-check.yml|portal/m360/start-here.html|portal/m360/start-here.js|portal/m360/start-here.css)$' || true)"
          if [ -n "$unexpected" ]; then
            echo '::error::Wave 2 is intentionally limited to Start Here usability surfaces.'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check portal/m360/start-here.js

      - name: Require baseline support explanation
        run: |
          set -euo pipefail
          grep -q 'How this baseline is used' portal/m360/start-here.html
          grep -q 'does not lower your M360 grade' portal/m360/start-here.html
          grep -q 'This response is not graded' portal/m360/start-here.html
          grep -q 'supportFlag(payload)' portal/m360/start-here.js

      - name: Require privacy-safe professional profile language
        run: |
          set -euo pipefail
          grep -q 'Professional profile status' portal/m360/start-here.html
          grep -q 'you do not need to make personal information public' portal/m360/start-here.html
          grep -q 'Privacy / exception support needed' portal/m360/start-here.html
          grep -q "payload.profileStatus === 'privacy_support'" portal/m360/start-here.js

      - name: Require readiness access-path language
        run: |
          set -euo pipefail
          grep -q 'you have reported an access issue and know how to get help' portal/m360/start-here.html
          grep -q 'reported the access issue to Mission Next staff' portal/m360/start-here.html
          grep -q 'Do not hide an access problem just to finish Start Here' portal/m360/start-here.html
          grep -q "const techIds = \['techLms','techLive','techFiles','techFeedback'\]" portal/m360/start-here.js

      - name: Require field-level completion validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          js = Path('portal/m360/start-here.js').read_text()
          css = Path('portal/m360/start-here.css').read_text()
          html = Path('portal/m360/start-here.html').read_text()
          required_js = [
              'validateCompletion()',
              "setAttribute('aria-invalid', 'true')",
              'field-error-state',
              'technologyError',
              'acknowledgmentError',
              'Review the highlighted item'
          ]
          for token in required_js:
              if token not in js:
                  raise SystemExit(f'Missing Start Here validation requirement: {token}')
          required_css = ['.field-error-state', '.field-error', '.validation-group-error', '.group-error']
          for token in required_css:
              if token not in css:
                  raise SystemExit(f'Missing Start Here validation style: {token}')
          for token in ['id="technologyError"', 'id="acknowledgmentError"', 'aria-live="polite"']:
              if token not in html:
                  raise SystemExit(f'Missing Start Here validation/accessibility surface: {token}')
          PY

      - name: Require aligned acknowledgment and readiness checks
        run: |
          set -euo pipefail
          grep -q 'grid-template-columns:20px minmax(0,1fr)' portal/m360/start-here.css
          grep -q '.check-list input{width:16px;height:16px;margin:2px 0 0;justify-self:center}' portal/m360/start-here.css

      - name: Preserve established product boundaries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if printf '%s\n' "$changed" | grep -Eq '^supabase/'; then
            echo '::error::Wave 2 must not change Supabase schema or migrations.'
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Eq '^portal/(app\.js|data\.js|module-labs\.js|soc-analyst-module-|it-support-module-|ai-ml-module-|electrical-module-)'; then
            echo '::error::Wave 2 must not change the established technical-course LMS runtime.'
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Eq '^portal/(m360-preview.html|m360/course.html|m360/week[3-6].html)$'; then
            echo '::error::Wave 2 must not change the held workbook-delivery decision.'
            exit 1
          fi
          echo 'Wave 2 preserves Supabase, technical-course runtime, grading, and workbook delivery boundaries.'
